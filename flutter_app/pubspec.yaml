name: pulsenow_flutter
description: PulseNow Flutter Assessment - Crypto Trading & Analytics Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # HTTP
  http: ^1.1.0
  
  # WebSocket
  web_socket_channel: ^2.4.0
  
  # UI
  cupertino_icons: ^1.0.6
  
  # Utilities
  intl: ^0.20.2
  get_it: ^7.6.4
  shared_preferences: ^2.2.2
  
  # Navigation
  go_router: ^14.0.0
  
  # Responsive Design
  flutter_screenutil: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  generate: true